<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuyMoto Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

/* Header */
header{
    background:linear-gradient(135deg,#111,#444);
    color:white;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#ffcc00;
}

nav ul{
    list-style:none;
    display:flex;
    gap:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:0.3s;
}

nav ul li a:hover{
    color:#ffcc00;
}

/* Banner */
.banner{
    height:500px;
    background:url('https://images.unsplash.com/photo-1558981806-ec527fa84c39') center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.banner-content{
    background:rgba(0,0,0,0.6);
    padding:30px;
    border-radius:10px;
}

.banner h1{
    color:white;
    font-size:50px;
    margin-bottom:15px;
}

.banner p{
    color:#ddd;
    font-size:20px;
    margin-bottom:20px;
}

.btn{
    background:#ffcc00;
    color:black;
    padding:12px 25px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

.btn:hover{
    background:#ffaa00;
}

/* Products */
.products{
    padding:50px;
    text-align:center;
}

.products h2{
    margin-bottom:30px;
    font-size:35px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h3{
    margin:15px 0;
}

.card p{
    color:red;
    font-weight:bold;
    margin-bottom:15px;
}

.card button{
    background:#111;
    color:white;
    border:none;
    padding:10px 20px;
    margin-bottom:15px;
    cursor:pointer;
}

.card button:hover{
    background:#ffcc00;
    color:black;
}

/* Footer */
footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>
</head>

<body>

<header>
    <div class="logo">DuyMoto Shop</div>

    <nav>
        <ul>
            <li><a href="html/gioi-thieu.html">Trang chủ</a></li>
             <li><a href="html/san-pham.html">Sản Phẩm</a></li>
            <li><a href="html/lien-he.html">Liên Hệ</a></li>
        </ul>
    </nav>
</header>

<section class="banner">
    <div class="banner-content">
        <h1>Phụ Kiện Moto & Xe Máy Chính Hãng</h1>
        <p>Đồ chơi xe - Phụ kiện bảo hộ - Đèn LED - Gương xe - Mũ bảo hiểm</p>
    </div>
</section>

<footer>
    <p>📧 Email: duymotoshop@gmail.com | ☎ Hotline: 0869219091</p>
    <p>© 2026 DuyMoto Shop - Phụ Kiện Moto & Xe Máy</p>
</footer>

</body>
</html>
